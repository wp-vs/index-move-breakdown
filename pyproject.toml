[project]
name = "etf-move-breakdown"
version = "0.1.0"
description = "Sector ETF move breakdown into per-stock contributions"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.30",
    "rich>=13.0",
    "flask>=3.0",
]

[project.scripts]
etf-breakdown = "etf_breakdown.cli:main"
etf-web = "etf_breakdown.web:main"

[project.optional-dependencies]
ib = ["ib_insync>=0.9.86"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
